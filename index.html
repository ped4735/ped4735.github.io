<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Central de acesso aos projetos e experimentos.">
    <title>Meus projetos</title>
    <link rel="stylesheet" href="menu.css">
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Menu de projetos">
        <div class="sidebar-header">
          <a class="brand" href="./" aria-label="Página inicial">
            <span class="brand-mark" aria-hidden="true">P</span>
            <span class="brand-copy">
              <strong id="menu-title">Projetos</strong>
              <small>Central de aplicações</small>
            </span>
          </a>

          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Recolher menu" aria-controls="sidebar" aria-expanded="true">
            <span class="toggle-icon" aria-hidden="true"></span>
          </button>
        </div>

        <nav class="menu" id="menu" aria-label="Navegação principal">
          <div class="menu-loading" aria-live="polite">
            <span class="loading-line"></span>
            <span class="loading-line short"></span>
            <span class="loading-line"></span>
          </div>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="sidebar-footer-text">Pronto para explorar</span>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Fechar menu"></button>

      <main class="content">
        <header class="topbar">
          <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>

          <div class="page-heading">
            <h1 id="page-title">Carregando...</h1>
          </div>

          <a class="open-page" id="open-page" href="#" target="_blank" rel="noopener" aria-label="Abrir página atual em nova aba">
            <span>Abrir página</span>
            <span aria-hidden="true">↗</span>
          </a>
        </header>

        <section class="viewer" aria-label="Conteúdo do projeto">
          <div class="viewer-loading" id="viewer-loading" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <span>Carregando página...</span>
          </div>

          <iframe id="page-frame" title="Conteúdo selecionado" hidden></iframe>

          <div class="viewer-message" id="viewer-message" hidden>
            <span class="message-icon" aria-hidden="true">!</span>
            <h2 id="message-title">Não foi possível carregar o menu</h2>
            <p id="message-text">Verifique o arquivo menu.json e tente novamente.</p>
            <button id="retry-button" type="button">Tentar novamente</button>
          </div>
        </section>
      </main>
    </div>

    <script src="menu.js"></script>
  </body>
</html>
